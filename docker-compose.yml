services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:4.9
    environment:
      SERVICES: sns,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    volumes:
      - ./docker/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs get-queue-url --queue-name lending-limit-events >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
